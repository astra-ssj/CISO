name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish release assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}" >&2
            exit 1
          fi

      - name: Build release runtime image
        run: docker build --target runner -t astra-ciso:release .

      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: astra-ciso:release
          format: spdx-json
          output: astra-ciso-v0.1.0-sbom.spdx.json
          vuln-type: os,library

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: astra-ciso:release
          format: cyclonedx
          output: astra-ciso-v0.1.0-sbom.cdx.json
          vuln-type: os,library

      - name: Generate checksums
        run: sha256sum astra-ciso-v0.1.0-sbom.spdx.json astra-ciso-v0.1.0-sbom.cdx.json > SHA256SUMS

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            astra-ciso-v0.1.0-sbom.spdx.json \
            astra-ciso-v0.1.0-sbom.cdx.json \
            SHA256SUMS \
            --verify-tag \
            --prerelease \
            --title "Astra CISO ${GITHUB_REF_NAME} — Community Preview" \
            --notes-file RELEASE.md
