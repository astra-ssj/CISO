name: Dependency Refresh

on:
  workflow_dispatch:
  push:
    branches:
      - chore/oss-v0.1-hardening
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/oss-v0.1-hardening

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Refresh security-sensitive direct dependencies
        run: |
          npm install --save-exact next@16.4.1 next-auth@5.0.0-beta.32 nodemailer@10.0.6

      - name: Commit lockfile refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: refresh vulnerable framework dependencies"
            git push origin HEAD:chore/oss-v0.1-hardening
          fi
