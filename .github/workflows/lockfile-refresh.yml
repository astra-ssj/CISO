name: Lockfile Refresh

on:
  push:
    branches:
      - chore/oss-v0.1-hardening
    paths:
      - .github/workflows/lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/oss-v0.1-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Resolve lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: refresh lockfile after auth and map upgrades"
            git pull --rebase origin chore/oss-v0.1-hardening
            git push origin HEAD:chore/oss-v0.1-hardening
          fi
