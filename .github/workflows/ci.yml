name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Type Check · Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build
        env:
          # Provide minimal env so Next.js build doesn't fail on missing vars
          DATABASE_URL: file:/tmp/test.db
          AUTH_SECRET: ci-placeholder-secret-32-chars-long
          NEXTAUTH_SECRET: ci-placeholder-secret-32-chars-long
          NEXTAUTH_URL: http://localhost:3000
